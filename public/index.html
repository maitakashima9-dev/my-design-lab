<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY+DESIGN LAB.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Yomogi&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="logo">MY<span class="dot">+</span>DESIGN LAB.</div>
    <div class="login-sub">受講生・管理者専用ページです</div>
    <div id="loginError" class="login-error" style="display:none;"></div>
    <div class="form-group"><label>メールアドレス</label><input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="username"></div>
    <div class="form-group"><label>パスワード</label><input type="password" id="loginPassword" placeholder="パスワード" autocomplete="current-password" onkeydown="if(event.key==='Enter')handleLogin()"></div>
    <button class="btn" id="loginBtn" onclick="handleLogin()">ログイン</button>
  </div>
</div>

<div id="app" class="hidden">
  <div class="topbar">
    <button class="hamburger-btn" onclick="toggleSidebar()" aria-label="メニュー">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>
    <div class="logo">MY<span class="dot">+</span>DESIGN LAB.</div>
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="text" placeholder="記事・動画・資料を検索" oninput="handleSearch(this.value)" onfocus="handleSearch(this.value)">
      <div id="searchResults" class="search-results" style="display:none;"></div>
    </div>
    <div class="topbar-right">
      <div class="role-switch" id="roleSwitch" onclick="handleLogout()"></div>
      <div class="bell-wrap" onclick="appNav('announce')" title="お知らせ">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="dot"></span>
      </div>
      <div class="avatar-block" id="avatarBlock" onclick="appNav('mypage')"></div>
    </div>
  </div>
  <div class="body-wrap">
    <div class="sidebar" id="sidebar"></div>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <main id="viewRoot"><div class="loading-row">読み込み中...</div></main>
  </div>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script src="/app.js" defer></script>
</body>
</html>
